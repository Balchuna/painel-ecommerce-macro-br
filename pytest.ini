[pytest]
testpaths = tests
markers =
    powerbi: lê o projeto do Power BI com a biblioteca TOM do Power BI Desktop (Windows com Power BI instalado)
    desktop: abre o projeto do Power BI no Power BI Desktop, atualiza e confere DAX com o gabarito (só com --desktop)
    browser: abre o painel web em navegador headless (Playwright) para conferir carregamento, console e layout
