<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel E-Commerce & Macroeconomia Brasil</title>
  <meta name="description" content="Painel interativo com ~100 mil pedidos reais do e-commerce brasileiro (Olist) cruzados com IPCA, Selic e PTAX do Banco Central e população do IBGE.">
  <meta name="theme-color" content="#FFFFFF">
  <meta property="og:title" content="Painel E-Commerce & Macroeconomia Brasil">
  <meta property="og:description" content="Olist + Banco Central (SGS) + IBGE: GMV real deflacionado pelo IPCA, SLA logístico por UF, coortes e auditoria de qualidade.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231E3A5F'/%3E%3Crect x='7' y='17' width='4' height='8' rx='1' fill='%23A9BCD3'/%3E%3Crect x='14' y='12' width='4' height='13' rx='1' fill='%23A9BCD3'/%3E%3Crect x='21' y='7' width='4' height='18' rx='1' fill='%230D9488'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="appbar">
    <div class="appbar__inner">
      <a class="brand" href="#p1" aria-label="Início">
        <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="7" fill="#1E3A5F"/>
          <rect x="7" y="17" width="4" height="8" rx="1" fill="#A9BCD3"/>
          <rect x="14" y="12" width="4" height="13" rx="1" fill="#A9BCD3"/>
          <rect x="21" y="7" width="4" height="18" rx="1" fill="#0D9488"/>
        </svg>
        <span class="brand__text">
          <span class="brand__kicker" data-i18n="brand.kicker">Portfólio · Dados &amp; BI</span>
          <span class="brand__title" data-i18n="brand.title">Painel E-Commerce &amp; Macroeconomia Brasil</span>
        </span>
      </a>
      <nav class="tabs" role="tablist" aria-label="Páginas">
        <button class="tab" role="tab" id="tab-p1" aria-controls="p1" aria-selected="true" data-page="p1"><span class="tab__num">01</span><span data-i18n="tab.p1">Executivo &amp; Macro</span></button>
        <button class="tab" role="tab" id="tab-p2" aria-controls="p2" aria-selected="false" data-page="p2"><span class="tab__num">02</span><span data-i18n="tab.p2">Logística &amp; SLA</span></button>
        <button class="tab" role="tab" id="tab-p3" aria-controls="p3" aria-selected="false" data-page="p3"><span class="tab__num">03</span><span data-i18n="tab.p3">Comercial &amp; Coorte</span></button>
        <button class="tab" role="tab" id="tab-p4" aria-controls="p4" aria-selected="false" data-page="p4"><span class="tab__num">04</span><span data-i18n="tab.p4">Qualidade &amp; Linhagem</span></button>
      </nav>
      <div class="lang" role="group" aria-label="Idioma / Language">
        <button type="button" data-lang="pt" aria-pressed="true">PT</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="pagehead">
      <div class="pagehead__text">
        <p class="eyebrow" id="ph-eyebrow"></p>
        <h1 id="ph-title">Painel E-Commerce &amp; Macroeconomia Brasil</h1>
        <p class="pagehead__sub" id="ph-sub"></p>
      </div>
      <form class="filters" id="filters" aria-label="Filtros" onsubmit="return false">
        <div class="filter">
          <label for="f-ano" data-i18n="f.ano">Ano</label>
          <select id="f-ano"></select>
        </div>
        <div class="filter">
          <label for="f-regiao" data-i18n="f.regiao">Região</label>
          <select id="f-regiao"></select>
        </div>
        <div class="filter">
          <label for="f-categoria" data-i18n="f.categoria">Categoria</label>
          <select id="f-categoria"></select>
        </div>
        <button type="button" class="reset" id="f-reset" hidden data-i18n="f.reset">Limpar</button>
      </form>
    </div>

    <div id="status" class="loading" role="status" data-i18n="status.loading">Carregando dados…</div>

    <section class="page" id="p1" role="tabpanel" aria-labelledby="tab-p1"></section>
    <section class="page" id="p2" role="tabpanel" aria-labelledby="tab-p2" hidden></section>
    <section class="page" id="p3" role="tabpanel" aria-labelledby="tab-p3" hidden></section>
    <section class="page" id="p4" role="tabpanel" aria-labelledby="tab-p4" hidden></section>

    <footer class="foot">
      <div class="foot__row">
        <div>
          <p id="foot-sources"></p>
          <p class="muted" id="foot-meta"></p>
        </div>
        <p><a href="https://github.com/Balchuna/painel-ecommerce-macro-br" rel="noopener" data-i18n="foot.repo">Código, SQL e Power BI no GitHub →</a></p>
      </div>
    </footer>
  </main>

  <div class="tip" id="tip" role="tooltip"></div>
  <noscript><p class="wrap">Este painel precisa de JavaScript. / This dashboard requires JavaScript.</p></noscript>
  <script src="app.js" defer></script>
</body>
</html>
